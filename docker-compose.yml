services:
  monitor:
    image: ${MONITOR_IMAGE:-ghcr.io/facio313/monitor:latest}
    build:
      context: .
      args:
        PORTFOLIO_BRANCH: ${PORTFOLIO_BRANCH:?run Compose through npm run compose}
        PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:?run Compose through npm run compose}
    container_name: monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONITOR_PORT:-5181}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONITOR_DATA_DIR: /data
      MONITOR_SECURITY_STATE_DIR: /var/lib/monitor-security
      MONITOR_ALLOWED_ORIGINS: ${MONITOR_ALLOWED_ORIGINS:-https://bonifacio.work}
    volumes:
      - type: bind
        source: ${MONITOR_EXPORT_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/monitor-update-socket
        target: /run/monitor-update
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITOR_SECURITY_STATE_PATH:-/var/lib/monitor-security}
        target: /var/lib/monitor-security
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/readyz').then((response) => {
          if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
