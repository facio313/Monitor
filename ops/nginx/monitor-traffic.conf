# Privacy-preserving request counters for Monitor incident correlation.
#
# This file is included from nginx.conf's http context.  The allowlist emits a
# fixed application label; the requested URI is used only for the in-memory map
# lookup and is never written to disk.  Anything not explicitly listed,
# including out-of-scope services, is intentionally excluded.
map $host $monitor_traffic_site {
    default         "";
    bonifacio.work  portfolio;
}

map "$monitor_traffic_site:$uri" $monitor_traffic_app {
    default "";

    ~^portfolio:/monitor(?:/|$)            monitor;
    ~^portfolio:/feelmyrythm(?:/|$)        feelmyrythm;
    ~^portfolio:/multtara(?:/|$)           multtara;
    ~^portfolio:/pilgrimage(?:/|$)         pilgrimage;
    ~^portfolio:/ddit-finalproject(?:/|$)  ddit-finalproject;
    ~^portfolio:/dukkeobi(?:/|$)           dukkeobi;
    ~^portfolio:/react(?:/|$)              react;
    ~^portfolio:/vue(?:/|$)                vue;
}

map $monitor_traffic_app $monitor_traffic_enabled {
    default 1;
    ""      0;
}

log_format monitor_privacy_aggregate escape=json
    '{"timestamp":"$time_iso8601","app":"$monitor_traffic_app",'
    '"status":$status,"requestTime":$request_time}';

access_log /var/log/nginx/monitor-traffic.jsonl monitor_privacy_aggregate
    buffer=32k flush=1m if=$monitor_traffic_enabled;
