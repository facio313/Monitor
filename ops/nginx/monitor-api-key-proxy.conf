# Common proxy policy for the dedicated API-key locations. This file belongs
# inside a location and must never be included by the browser/SSO location.
# The alias fails closed unless the original TCP peer is Cloudflare/loopback
# and Nginx itself terminated TLS. This prevents accidentally exposing bearer
# credentials through a Flexible-mode HTTP origin.
if ($monitor_api_key_peer_allowed = 0) { return 403; }
if ($https != on) { return 426; }

include /etc/nginx/snippets/monitor-cloudflare-real-ip.conf;
include /etc/nginx/snippets/monitor-edge-secret.conf;

proxy_pass         http://127.0.0.1:5181;
proxy_http_version 1.1;
proxy_set_header   Host                         $host;
proxy_set_header   Authorization                $http_authorization;
proxy_set_header   X-Real-IP                    $remote_addr;
# Replace, rather than append to, the untrusted incoming chain. Express trusts
# exactly this one Nginx hop for API-key source-address restrictions.
proxy_set_header   X-Forwarded-For              $remote_addr;
proxy_set_header   X-Forwarded-Proto            https;
proxy_set_header   X-Forwarded-Prefix           /monitor;

# The API-key ingress never carries browser or mTLS proxy authority. Clearing
# these fields prevents a caller from combining the origin edge credential
# injected above with client-supplied trusted identity headers.
proxy_set_header   Cookie                       "";
proxy_set_header   Remote-User                  "";
proxy_set_header   Remote-Groups                "";
proxy_set_header   Remote-Name                  "";
proxy_set_header   Remote-Email                 "";
proxy_set_header   X-Monitor-mTLS-Verified      "";
proxy_set_header   X-Monitor-Client-Cert-SHA256 "";
proxy_set_header   X-Monitor-Client-Cert-Not-After "";

client_max_body_size 16k;
proxy_connect_timeout 3s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;
proxy_no_cache        1;
proxy_cache_bypass    1;
proxy_hide_header     Cache-Control;
proxy_hide_header     Set-Cookie;
add_header            Cache-Control "no-store" always;
proxy_intercept_errors off;
