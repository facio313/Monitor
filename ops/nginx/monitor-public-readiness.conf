# Include this exact location in the bonifacio.work HTTPS server block before
# the broader `location ^~ /monitor/` block. It deliberately exposes only the
# reduced readiness contract and never bypasses SSO for the dashboard or APIs.
location = /monitor/readyz {
    proxy_pass         http://127.0.0.1:5181/readyz;
    proxy_http_version 1.1;
    proxy_set_header   Host                 $host;
    proxy_set_header   X-Real-IP            $remote_addr;
    proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto    https;
    proxy_set_header   X-Forwarded-Prefix   /monitor;
    proxy_no_cache     1;
    proxy_cache_bypass 1;
    proxy_hide_header  Cache-Control;
    add_header         Cache-Control "no-store" always;
    proxy_intercept_errors off;
}
