# Include in the bonifacio.work HTTPS server before `location ^~ /monitor/`.
# Only these method/path pairs bypass SSO. Each public alias rewrites to the
# application's existing exact bearer allowlist; security-management and agent
# mTLS endpoints are intentionally absent.
# Keep the proxy include before each `rewrite ... break`: `break` stops the
# rewrite phase, including the fail-closed peer/TLS guards in that include.

location = /monitor/api-key/v1/dashboard {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/snippets/monitor-api-key-proxy.conf;
    rewrite ^ /monitor/api/dashboard break;
}

location = /monitor/api-key/v1/generic-logs {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/snippets/monitor-api-key-proxy.conf;
    rewrite ^ /monitor/api/generic-logs break;
}

location = /monitor/api-key/v1/agents {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/snippets/monitor-api-key-proxy.conf;
    rewrite ^ /monitor/api/agents break;
}

location = /monitor/api-key/v1/agents/enrollment-tokens {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/snippets/monitor-api-key-proxy.conf;
    rewrite ^ /monitor/api/agents/enrollment-tokens break;
}

# UUIDv4-bound agent administration is the sole dynamic API-key alias. The
# longer ^~ prefix wins over the SSO prefix, while this normalized-URI guard
# rejects every path outside the two application allowlist shapes.
location ^~ /monitor/api-key/v1/agents/ {
    if ($request_method != POST) { return 405; }
    if ($uri !~ "^/monitor/api-key/v1/agents/[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}/(?:certificate-rotation-tokens|revoke)$") { return 404; }
    include /etc/nginx/snippets/monitor-api-key-proxy.conf;
    rewrite "^/monitor/api-key/v1/agents/([a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})/(certificate-rotation-tokens|revoke)$" /monitor/api/agents/$1/$2 break;
}

