// Invocation-local policy for Monitor's exact host package transaction.
// No administrator hook is allowed to run before the fail-closed validator.
#clear DPkg::Pre-Invoke;
#clear DPkg::Pre-Install-Pkgs;
DPkg::Pre-Install-Pkgs:: "/usr/local/lib/monitor-updater/monitor_update_worker.py --verify-apt-transaction";
DPkg::Tools::options::/usr/local/lib/monitor-updater/monitor_update_worker.py::Version "3";
DPkg::Tools::options::/usr/local/lib/monitor-updater/monitor_update_worker.py::InfoFD "0";
