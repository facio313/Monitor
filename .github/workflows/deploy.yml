name: Build and deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: monitor-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/facio313/monitor
  PORTFOLIO_BRANCH: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    name: Test and build multi-architecture image; deploy main
    runs-on: ubuntu-24.04-arm
    # The restricted host may spend up to 20 minutes waiting for the shared
    # fleet deploy lock. Leave enough time for image publication, cutover, and
    # rollback verification without interrupting the host mid-deployment.
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install and validate application dependencies
        run: |
          npm ci
          npm run typecheck
          npm run test:raw -- --reporter=dot
          npm audit --audit-level=critical

      - name: Validate source hygiene and script syntax
        run: |
          git diff-tree --check HEAD^ HEAD
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty bash -n
          git ls-files -z '*.py' | xargs -0 --no-run-if-empty python3 -m py_compile
          git ls-files -z '*.json' | xargs -0 --no-run-if-empty -n 1 python3 -m json.tool >/dev/null
          git ls-files -z 'ops/systemd/*' | xargs -0 --no-run-if-empty systemd-analyze verify
          python3 ops/state_backup.py backup --help >/dev/null
          python3 ops/state_backup.py verify --help >/dev/null
          python3 ops/state_backup.py restore --help >/dev/null
          python3 ops/state_backup.py recover --help >/dev/null

      - name: Resolve branch authentication contract
        id: auth
        run: |
          set -eu
          ./scripts/test-portfolio-auth-mode.sh
          mode=$(./scripts/portfolio-auth-mode.sh print)
          {
            printf 'branch=%s\n' "$PORTFOLIO_BRANCH"
            printf 'mode=%s\n' "$mode"
            printf 'tags<<EOF\n'
            printf '%s:%s\n' "$IMAGE_NAME" "$GITHUB_SHA"
            if [ "$GITHUB_REF_NAME" = main ]; then
              printf '%s:latest\n' "$IMAGE_NAME"
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Validate branch authentication contract and host collector
        run: |
          python3 -m unittest discover -s ops/tests -p 'test_*.py'

      - name: Validate production Compose configuration
        env:
          PORTFOLIO_BRANCH: ${{ steps.auth.outputs.branch }}
          PORTFOLIO_AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          npm run compose -- config --quiet
          PORTFOLIO_BRANCH=ci/local \
            PORTFOLIO_AUTH_MODE=local \
            npm run compose -- config --quiet

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up multi-architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build, test, and publish multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.auth.outputs.tags }}
          build-args: |
            PORTFOLIO_BRANCH=${{ steps.auth.outputs.branch }}
            PORTFOLIO_AUTH_MODE=${{ steps.auth.outputs.mode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published platform manifest
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_SHA" --raw | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const index = JSON.parse(input);
              const platforms = new Set((index.manifests || [])
                .map((entry) => `${entry.platform?.os || ""}/${entry.platform?.architecture || ""}`));
              for (const expected of ["linux/amd64", "linux/arm64"]) {
                if (!platforms.has(expected)) {
                  throw new Error(`published manifest is missing ${expected}`);
                }
              }
            });
          '

      - name: Scan arm64 production image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Scan amd64 production image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Request restricted server deployment
        if: github.ref_name == 'main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT

          printf '%s\n' \
            '[ssh.bonifacio.work]:22022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII91ovdQZMg9NpUyjjFSS0Ra0SEuYuAw4Uv3GTv6J92F' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$GHCR_TOKEN"
            printf '%s\n' "$DEPLOY_ACTOR"
          } | ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p 22022 \
            cks@ssh.bonifacio.work \
            "deploy monitor $GITHUB_SHA"
