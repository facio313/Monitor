name: Scheduled resilience gate

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-resilience
  cancel-in-progress: false

jobs:
  resilience:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Run bounded load, offline replay, skew, storage, and network recovery gates
        env:
          PORTFOLIO_BRANCH: main
          PORTFOLIO_AUTH_MODE: sso
        run: npm run test:resilience
